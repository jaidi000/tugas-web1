<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Gadget & Aksesoris</title>
    <!-- Menghubungkan CSS Eksternal -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar Fixed di Atas -->
    <nav class="navbar">
      <div class="brand">Jaidi Store</div>
      <ul class="nav-links">
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Produk</a></li>
        <li><a href="#">Kontak</a></li>
      </ul>
    </nav>

    <!-- Konten Utama (Diberi kompensasi padding di CSS) -->
    <main class="content">
      <!-- Elemen Sticky -->
      <h2 class="kategori-sticky">Kategori: Aksesoris Komputer</h2>

      <!-- Container Kartu Produk -->
      <div class="produk-container">
        <!-- Kartu 1 -->
        <div class="card">
          <span class="badge badge-diskon">Diskon 20%</span>
          <div class="img-container">
            <img
              src="https://picsum.photos/id/0/300/200"
              alt="Keyboard Mekanikal"
            />
          </div>
          <h3 class="nama-produk">Keyboard Mekanikal</h3>
          <p class="harga">Rp 450.000</p>
          <button class="btn-beli">Beli Sekarang</button>
        </div>

        <!-- Kartu 2 -->
        <div class="card">
          <span class="badge badge-baru">Baru</span>
          <div class="img-container">
            <img src="https://picsum.photos/id/119/300/200" alt="MacBook Pro" />
          </div>
          <h3 class="nama-produk">MacBook Aksesoris</h3>
          <p class="harga">Rp 120.000</p>
          <button class="btn-beli">Beli Sekarang</button>
        </div>

        <!-- Kartu 3 -->
        <div class="card">
          <div class="img-container">
            <img
              src="https://picsum.photos/id/4/300/200"
              alt="Mouse Wireless"
            />
          </div>
          <h3 class="nama-produk">Mouse Wireless</h3>
          <p class="harga">Rp 150.000</p>
          <button class="btn-beli">Beli Sekarang</button>
        </div>

        <!-- Kartu 4 -->
        <div class="card">
          <span class="badge badge-laris">Terlaris</span>
          <div class="img-container">
            <img src="https://picsum.photos/id/3/300/200" alt="Monitor Stand" />
          </div>
          <h3 class="nama-produk">Smart Monitor Stand</h3>
          <p class="harga">Rp 250.000</p>
          <button class="btn-beli">Beli Sekarang</button>
        </div>
      </div>
    </main>

    <!-- Muhammad Jaidi, 14 Oktober 2026 -->
  </body>
</html>
